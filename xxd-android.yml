name: XXD-VPN Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: dev
  UPLOAD_ARTIFACT: "true"
  TAG_NAME: draft
  FLUTTER_VERSION: '3.38.5'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # XXD-VPN: put my modified files in place and apply my settings (GitHub Variables)
      - name: Apply XXD-VPN overlay
        env:
          XXD_DOMAIN: ${{ vars.XXD_DOMAIN }}
          XXD_CLIENT_PATH: ${{ vars.XXD_CLIENT_PATH }}
          XXD_WHATSAPP_CHANNEL: ${{ vars.XXD_WHATSAPP_CHANNEL }}
          XXD_TELEGRAM_CHANNEL: ${{ vars.XXD_TELEGRAM_CHANNEL }}
          XXD_ADMIN_WHATSAPP: ${{ vars.XXD_ADMIN_WHATSAPP }}
          XXD_GITHUB_REPO: ${{ github.repository }}
        run: |
          unzip -oq xxd-overlay.zip -d /tmp/xxd
          python3 /tmp/xxd/xxd_apply.py /tmp/xxd

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get autoremove -y
          sudo apt-get clean

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup dependencies
        run: |
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      # Optional signing. Without the 4 secrets the APK is signed with the debug key
      # (it installs fine, but you cannot publish updates on the same key later).
      - name: Signing keys (optional)
        env:
          KEY_B64: ${{ secrets.ANDROID_SIGNING_KEY }}
        if: ${{ env.KEY_B64 != '' }}
        run: |
          echo "$KEY_B64" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Prepare
        run: make android-apk-prepare

      - name: Build APK
        run: make android-apk-release

      - name: Name the APK
        run: |
          mkdir out
          ls -R build/app/outputs
          cp build/app/outputs/flutter-apk/app-release.apk out/XXD-VPN-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: XXD-VPN-release
          path: out/XXD-VPN-release.apk

      # Push a tag like v1.0.1 to publish a GitHub Release (the in-app updater reads these).
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" out/XXD-VPN-release.apk \
            --title "XXD-VPN ${{ github.ref_name }}" --notes "XXD-VPN ${{ github.ref_name }}"
